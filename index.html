<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Essensplaner</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { -webkit-tap-highlight-color: transparent; }</style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-20">

  <!-- HEADER -->
  <header class="bg-emerald-600 text-white p-4 sticky top-0 shadow-md flex justify-between items-center z-10">
    <h1 class="text-xl font-bold">🍳 Essensplaner</h1>
    <button onclick="shareViaLink()" class="bg-emerald-700 hover:bg-emerald-800 px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1 shadow">
      📤 Plan per Link teilen
    </button>
  </header>

  <!-- CONTENT -->
  <main class="p-4 max-w-md mx-auto space-y-6">

    <!-- TAB 1: WOCHENPLAN -->
    <section id="sec-plan" class="tab-content space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold">Wochenplan</h2>
        <button onclick="generatePlan()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium shadow flex items-center gap-1">
          🎲 Alle neu würfeln
        </button>
      </div>
      <div id="planList" class="space-y-2"></div>
    </section>

    <!-- TAB 2: GERICHTE -->
    <section id="sec-dishes" class="tab-content hidden space-y-4">
      <h2 class="text-lg font-bold">Gerichte</h2>
      
      <div class="bg-white p-4 rounded-xl shadow space-y-3">
        <input id="dishName" type="text" placeholder="Gerichtsname (z.B. Lasagne)" class="w-full border p-2 rounded-lg text-sm">
        <select id="dishCategory" class="w-full border p-2 rounded-lg text-sm bg-white">
          <option value="all">Jederzeit</option>
          <option value="weekday">Unter der Woche</option>
          <option value="weekend">Wochenende</option>
        </select>

        <div>
          <div class="flex gap-2 mb-2">
            <input id="manualIngredient" type="text" placeholder="Zutat hinzufügen..." class="flex-1 border p-2 rounded-lg text-sm">
            <button onclick="addIngredient()" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg font-bold">+</button>
          </div>
          <div id="ingredientChips" class="flex flex-wrap gap-1"></div>
        </div>

        <button onclick="saveDish()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg font-semibold text-sm">Gericht speichern</button>
      </div>

      <div id="dishesList" class="space-y-2"></div>
    </section>

    <!-- TAB 3: EINKAUFSLISTE -->
    <section id="sec-shopping" class="tab-content hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold">Einkaufsliste</h2>
        <button onclick="clearShopping()" class="text-red-500 text-xs font-bold border border-red-200 bg-red-50 px-2 py-1 rounded-lg hover:bg-red-100">🗑️ Leeren</button>
      </div>

      <div class="flex gap-2">
        <input id="shopInput" type="text" placeholder="Artikel hinzufügen..." class="flex-1 border p-2 rounded-lg text-sm">
        <button onclick="addShopItem()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-bold">+</button>
      </div>

      <ul id="shoppingList" class="bg-white rounded-xl shadow divide-y"></ul>
    </section>

  </main>

  <!-- NAVIGATION -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-2 text-xs font-medium z-10 pb-5">
    <button onclick="switchTab('plan')" id="nav-plan" class="flex flex-col items-center text-emerald-600">📅 Planer</button>
    <button onclick="switchTab('dishes')" id="nav-dishes" class="flex flex-col items-center text-gray-400">🍲 Gerichte</button>
    <button onclick="switchTab('shopping')" id="nav-shopping" class="flex flex-col items-center text-gray-400">🛒 Einkauf</button>
  </nav>

  <script>
    let ingredients = [];
    
    // Daten aus dem lokalen Speicher (localStorage) auslesen
    let savedDishes = localStorage.getItem('dishes');
    let savedPlan = localStorage.getItem('plan');
    let savedShopping = localStorage.getItem('shopping');

    let state = {
      // Nur wenn noch NIE Gerichte eingegeben wurden, wird ein Beispielgericht hinterlegt
      dishes: savedDishes ? JSON.parse(savedDishes) : [
        { id: 1, name: 'Spaghetti Bolognese', cat: 'weekday', ingredients: ['Spaghetti', 'Hackfleisch', 'Tomaten'] }
      ],
      plan: savedPlan ? JSON.parse(savedPlan) : {},
      shopping: savedShopping ? JSON.parse(savedShopping) : []
    };

    function init() {
      // Import via Hash-Link falls vorhanden
      if (window.location.hash.length > 10) {
        try {
          const encodedData = window.location.hash.substring(1);
          const decoded = JSON.parse(decodeURIComponent(escape(atob(encodedData))));
          if (decoded) {
            // Bereits gespeicherte Gerichte nicht versehentlich löschen, falls der übertragene Link keine Gerichte enthält
            if (decoded.dishes && decoded.dishes.length > 0) {
              state.dishes = decoded.dishes;
            }
            if (decoded.plan) state.plan = decoded.plan;
            if (decoded.shopping) state.shopping = decoded.shopping;
            
            saveState();
            history.replaceState(null, null, ' ');
            alert('✅ Neuen Essensplan & Liste übernommen!');
          }
        } catch (e) {
          console.log('Fehler beim Link-Import');
        }
      }
      renderAll();
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`sec-${tab}`).classList.remove('hidden');
      ['plan', 'dishes', 'shopping'].forEach(t => {
        document.getElementById(`nav-${t}`).className = `flex flex-col items-center ${t === tab ? 'text-emerald-600' : 'text-gray-400'}`;
      });
    }

    function renderAll() {
      renderDishes();
      renderPlan();
      renderShopping();
    }

    function renderDishes() {
      document.getElementById('dishesList').innerHTML = state.dishes.map(d => `
        <div class="bg-white p-3 rounded-xl shadow flex justify-between items-center">
          <div>
            <div class="font-bold text-sm">${d.name}</div>
            <div class="text-xs text-gray-400">${d.ingredients ? d.ingredients.join(', ') : ''}</div>
          </div>
          <button onclick="deleteDish(${d.id})" class="text-gray-300 hover:text-red-500 font-bold px-2">✕</button>
        </div>
      `).join('');
    }

    function renderPlan() {
      const days = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
      document.getElementById('planList').innerHTML = days.map(day => `
        <div class="bg-white p-3 rounded-xl shadow flex justify-between items-center">
          <span class="font-semibold text-xs text-gray-400 w-20">${day}</span>
          <span class="font-bold text-sm text-gray-800 flex-1">${state.plan[day] || '<i>Offen</i>'}</span>
          <button onclick="rollSingleDay('${day}')" title="Nur diesen Tag neu würfeln" class="text-gray-400 hover:text-emerald-600 p-1 rounded-lg hover:bg-gray-100 transition-colors">
            🎲
          </button>
        </div>
      `).join('');
    }

    function renderShopping() {
      document.getElementById('shoppingList').innerHTML = state.shopping.map((item, idx) => `
        <li class="p-3 flex justify-between items-center text-sm">
          <span class="${item.done ? 'line-through text-gray-300' : ''} cursor-pointer" onclick="toggleShop(${idx})">${item.text}</span>
          <button onclick="removeShop(${idx})" class="text-gray-300 hover:text-red-500 font-bold px-2">✕</button>
        </li>
      `).join('');
    }

    function addIngredient() {
      const inp = document.getElementById('manualIngredient');
      if (inp.value.trim()) {
        ingredients.push(inp.value.trim());
        inp.value = '';
        renderChips();
      }
    }

    function renderChips() {
      document.getElementById('ingredientChips').innerHTML = ingredients.map(i => `<span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-1 rounded-full">${i}</span>`).join('');
    }

    function saveDish() {
      const name = document.getElementById('dishName').value.trim();
      if (!name) return;
      state.dishes.push({ id: Date.now(), name, cat: document.getElementById('dishCategory').value, ingredients: [...ingredients] });
      document.getElementById('dishName').value = '';
      ingredients = [];
      renderChips();
      saveState();
    }

    function deleteDish(id) {
      state.dishes = state.dishes.filter(d => d.id !== id);
      saveState();
    }

    function generatePlan() {
      const days = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
      days.forEach(day => {
        rollSingleDay(day, false);
      });
      saveState();
    }

    function rollSingleDay(day, shouldSave = true) {
      if (!state.dishes || state.dishes.length === 0) return;
      
      const isWeekend = (day === 'Samstag' || day === 'Sonntag');
      let matchingDishes = state.dishes.filter(d => {
        if (d.cat === 'all') return true;
        if (isWeekend && d.cat === 'weekend') return true;
        if (!isWeekend && d.cat === 'weekday') return true;
        return false;
      });

      if (matchingDishes.length === 0) matchingDishes = state.dishes;

      const randomDish = matchingDishes[Math.floor(Math.random() * matchingDishes.length)];
      state.plan[day] = randomDish.name;

      if (shouldSave) {
        saveState();
      }
    }

    function addShopItem() {
      const inp = document.getElementById('shopInput');
      if (inp.value.trim()) {
        state.shopping.push({ text: inp.value.trim(), done: false });
        inp.value = '';
        saveState();
      }
    }

    function toggleShop(idx) { state.shopping[idx].done = !state.shopping[idx].done; saveState(); }
    function removeShop(idx) { state.shopping.splice(idx, 1); saveState(); }
    function clearShopping() { state.shopping = []; saveState(); }

    function saveState() {
      localStorage.setItem('dishes', JSON.stringify(state.dishes));
      localStorage.setItem('plan', JSON.stringify(state.plan));
      localStorage.setItem('shopping', JSON.stringify(state.shopping));
      renderAll();
    }

    function shareViaLink() {
      const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
      const shareUrl = `${window.location.origin}${window.location.pathname}#${encoded}`;

      if (navigator.share) {
        navigator.share({
          title: 'Essensplan',
          url: shareUrl
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(shareUrl);
        alert('Teilen-Link kopiert!');
      }
    }

    window.onload = init;
  </script>
</body>
</html>
